services:
  app:
    build: .
    ports:
      - "${PORT:-8000}:8000"  # host port: PORT=8010 docker compose up --build
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-8}
    volumes:
      - ./data/runtime:/app/data/runtime
